[profile.default]
solc = "0.8.30"
optimizer = true
via_ir = true
evm_version = "osaka"
remappings = [
    "openzeppelin/=lib/openzeppelin-contracts/contracts/",
    "solady/=lib/solady/src/",
]

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 500
fail_on_revert = false

[lint]
lint_on_build = false
exclude_lints = [
    "asm-keccak256",
]
